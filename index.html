<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olabeaga Lab</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="description" content="Marketing con raíces, contenido con impacto.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #EE2934;
    }
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .logo {
      width: 280px;
      max-width: 80vw;
      margin-bottom: 2.5rem;
      filter: brightness(0) invert(1);
    }
    .message {
      font-size: 24px;
      font-weight: 500;
      color: white;
      margin-bottom: .5rem;
      letter-spacing: -.2px;
    }
    .sub {
      font-size: 15px;
      color: rgba(255,255,255,.65);
      margin-bottom: 2.5rem;
    }
    .contact-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 2rem;
    }
    .pill {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,255,255,.12);
      border: 0.5px solid rgba(255,255,255,.25);
      border-radius: 99px;
      padding: 9px 18px;
      font-size: 13px;
      color: white;
      text-decoration: none;
    }
    .pill:hover { background: rgba(255,255,255,.2); }
    .footer {
      font-size: 11px;
      color: rgba(255,255,255,.35);
    }
  </style>
</head>
<body>
  <div class="page">
    <img class="logo" src="Recurso 6-8 (1).png" alt="Olabeaga Lab">
    <div class="message">Estamos cosechando.</div>
    <div class="sub">Pronto aquí.</div>
    <div class="contact-row">
      <a class="pill" href="mailto:hola@olabeagalab.com">✉ hola@olabeagalab.com</a>
      <a class="pill" href="https://instagram.com/olabeaga_" target="_blank">◎ @olabeaga_</a>
    </div>
    <div class="footer">© 2026 Olabeaga Lab</div>
  </div>
</body>
</html>
