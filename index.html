<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olabeaga Lab</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="description" content="Marketing con raíces, contenido con impacto.">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#EE2934;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .page{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:3rem 2rem 2rem}
    .logo-img{width:280px;max-width:80vw;margin-bottom:1.5rem;filter:brightness(0) invert(1)}
    .message{font-size:22px;font-weight:500;color:white;letter-spacing:-.2px;margin-bottom:2rem}
    .game-section{display:flex;flex-direction:column;align-items:center;width:100%}
    .score-wrap{display:flex;justify-content:space-between;width:600px;max-width:90vw;margin-bottom:6px;color:rgba(255,255,255,.8);font-size:12px;letter-spacing:.06em;font-family:monospace}
    canvas{display:block;image-rendering:pixelated;border-radius:4px;max-width:90vw}
    .hint{color:rgba(255,255,255,.55);font-size:11px;margin-top:8px;letter-spacing:.04em;text-align:center;font-family:monospace}
    .dead-options{display:none;flex-direction:column;align-items:center;gap:10px;margin-top:14px}
    .dead-options.show{display:flex}
    .dead-score{color:rgba(255,255,255,.7);font-size:12px;letter-spacing:.04em;font-family:monospace}
    .btn-game{background:rgba(255,255,255,.12);border:0.5px solid rgba(255,255,255,.3);border-radius:99px;padding:9px 22px;font-size:13px;color:white;cursor:pointer;font-family:monospace;letter-spacing:.04em}
    .btn-game:hover{background:rgba(255,255,255,.22)}
    .btn-row{display:flex;gap:10px}
    .bottom-section{margin-top:3rem;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:2rem;border-top:0.5px solid rgba(255,255,255,.15);width:100%;max-width:600px}
    .sub{font-size:16px;color:rgba(255,255,255,.75);margin-bottom:.4rem}
    .mientras{font-size:13px;color:rgba(255,255,255,.5);margin-bottom:1rem}
    .contact-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:1.5rem}
    .pill{background:rgba(255,255,255,.12);border:0.5px solid rgba(255,255,255,.25);border-radius:99px;padding:9px 18px;font-size:13px;color:white;text-decoration:none}
    .pill:hover{background:rgba(255,255,255,.22)}
    .footer{font-size:11px;color:rgba(255,255,255,.3)}
  </style>
</head>
<body>
  <div class="page">
    <img class="logo-img" src="Recurso 6-8 (1).png" alt="Olabeaga Lab">
    <div class="message">Estamos cosechando.</div>

    <div class="game-section">
      <div class="score-wrap">
        <span>RASTROJO RUNNER</span>
        <span id="score-display">COSECHA: 0</span>
        <span id="hi-display">RÉCORD: 0</span>
      </div>
      <canvas id="c" width="600" height="160"></canvas>
      <div class="hint" id="hint">ESPACIO o TAP para jugar</div>
      <div class="dead-options" id="dead-opts">
        <div class="dead-score" id="dead-score"></div>
        <div class="btn-row">
          <button class="btn-game" id="btn-retry">Reintentar</button>
          <button class="btn-game" id="btn-scroll">Ver más ↓</button>
        </div>
      </div>
    </div>

    <div class="bottom-section" id="bottom">
      <div class="sub">Pronto aquí.</div>
      <div class="mientras">Mientras tanto, encuéntranos en:</div>
      <div class="contact-row">
        <a class="pill" href="mailto:hola@olabeagalab.com">hola@olabeagalab.com</a>
        <a class="pill" href="https://instagram.com/olabeaga_" target="_blank">@olabeaga_</a>
      </div>
      <div class="footer">© 2026 Olabeaga Lab</div>
    </div>
  </div>

  <script>
    const canvas=document.getElementById('c');
    const ctx=canvas.getContext('2d');
    const W=600,H=160,GY=118;
    const RED='#EE2934',WHITE='#FFFFFF',YELLOW='#FFD700';
    const GROUND='#c45c1a',GROUNDTOP='#d4732a';

    let state='idle',score=0,hi=0,frame=0,speed=5,spawnTimer=0;
    const harvester={x:60,y:GY,w:48,h:32,vy:0,onGround:true};
    const obstacles=[];
    const clouds=[{x:80,y:18,w:50,s:.3},{x:280,y:10,w:40,s:.4},{x:480,y:20,w:45,s:.25}];

    function drawPixelRect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),w,h);}

    function drawHarvester(x,y,alive){
      const c=alive?null:'#aaa';
      drawPixelRect(x,y+8,48,20,c||YELLOW);
      drawPixelRect(x+28,y,20,16,c||WHITE);
      drawPixelRect(x+30,y+2,16,10,c||'#ADD8E6');
      drawPixelRect(x,y+8,4,20,c||RED);
      drawPixelRect(x,y+14,8,8,c||'#8B6914');
      drawPixelRect(x+4,y+26,8,8,c||'#222');
      drawPixelRect(x+5,y+27,6,6,c||'#444');
      drawPixelRect(x+7,y+27,2,6,c||'#666');
      drawPixelRect(x+5,y+29,6,2,c||'#666');
      drawPixelRect(x+32,y+24,12,10,c||'#222');
      drawPixelRect(x+33,y+25,10,8,c||'#444');
      drawPixelRect(x+37,y+25,2,8,c||'#666');
      drawPixelRect(x+33,y+29,10,2,c||'#666');
      if(alive){
        const lo=Math.floor(frame/4)%2===0?0:2;
        drawPixelRect(x-6,y+16+lo,8,4,c||'#DAA520');
        drawPixelRect(x-10,y+12,6,4,c||'#DAA520');
        drawPixelRect(x-8,y+8+lo,6,4,c||'#DAA520');
      }
      drawPixelRect(x+44,y+10,4,4,c||'#FF6600');
    }

    function drawBale(x,y){
      drawPixelRect(x+2,y+2,24,22,'#d4a055');
      drawPixelRect(x,y+4,4,20,GROUNDTOP);
      drawPixelRect(x+24,y+4,4,20,GROUNDTOP);
      for(let i=0;i<3;i++) drawPixelRect(x+4+i*8,y+2,4,22,'#b8892e');
      drawPixelRect(x+8,y,12,6,'#e8b84b');
    }

    function drawChicken(x,y){
      drawPixelRect(x+4,y,10,10,WHITE);
      drawPixelRect(x+12,y+2,4,6,WHITE);
      drawPixelRect(x+14,y+2,4,4,'#FF6600');
      drawPixelRect(x+2,y+2,4,4,'#FF0000');
      drawPixelRect(x+2,y+8,14,10,WHITE);
      drawPixelRect(x,y+16,6,6,'#FFD700');
      drawPixelRect(x+10,y+16,6,6,'#FFD700');
      ctx.fillStyle='#333';ctx.fillRect(x+14,y+3,2,2);
    }

    function drawCloud(x,y,w){
      ctx.fillStyle='rgba(255,255,255,0.12)';
      ctx.beginPath();
      ctx.arc(x+w*.3,y+6,w*.25,0,Math.PI*2);
      ctx.arc(x+w*.5,y+2,w*.3,0,Math.PI*2);
      ctx.arc(x+w*.7,y+6,w*.22,0,Math.PI*2);
      ctx.fill();
    }

    function drawGround(){
      drawPixelRect(0,GY+32,W,H-GY-32,GROUND);
      drawPixelRect(0,GY+32,W,4,GROUNDTOP);
    }

    function drawSun(){
      ctx.fillStyle='rgba(255,220,50,0.35)';
      ctx.beginPath();ctx.arc(W-35,22,14,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,220,50,0.15)';
      ctx.beginPath();ctx.arc(W-35,22,20,0,Math.PI*2);ctx.fill();
    }

    function drawScene(){
      ctx.fillStyle=RED;ctx.fillRect(0,0,W,H);
      drawSun();
      clouds.forEach(cl=>drawCloud(cl.x,cl.y,cl.w));
      drawGround();
      obstacles.forEach(o=>{
        if(o.type==='bale') drawBale(o.x,GY-o.h+32);
        else drawChicken(o.x,GY-o.h+32);
      });
    }

    function showDead(){
      document.getElementById('dead-opts').classList.add('show');
      document.getElementById('dead-score').textContent='COSECHA FINAL: '+Math.floor(score)+(score>=hi&&score>0?' · NUEVO RÉCORD!':'');
      document.getElementById('hint').style.display='none';
    }

    function hideDead(){
      document.getElementById('dead-opts').classList.remove('show');
      document.getElementById('hint').style.display='block';
      document.getElementById('hint').style.opacity='1';
    }

    function jump(){
      if(state==='idle'){state='playing';document.getElementById('hint').style.opacity='0';return;}
      if(harvester.onGround&&state==='playing'){harvester.vy=-12;harvester.onGround=false;}
    }

    function resetGame(){
      score=0;speed=5;frame=0;spawnTimer=0;
      obstacles.length=0;
      harvester.y=GY;harvester.vy=0;harvester.onGround=true;
      state='playing';
      hideDead();
    }

    function checkCollision(){
      const hx=harvester.x+6,hy=GY-harvester.h+32+4,hw=36,hh=22;
      for(const o of obstacles){
        if(hx<o.x+o.w-3&&hx+hw>o.x+3&&hy<GY-o.h+32+o.h-4&&hy+hh>GY-o.h+32+4) return true;
      }
      return false;
    }

    function gameLoop(){
      if(state==='idle'){
        drawScene();
        drawHarvester(harvester.x,GY-harvester.h+32,true);
        ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(W/2-110,H/2-18,220,36);
        ctx.fillStyle=WHITE;ctx.font='11px monospace';ctx.textAlign='center';
        ctx.fillText('ESPACIO o TAP para empezar',W/2,H/2+4);
        requestAnimationFrame(gameLoop);return;
      }
      if(state==='dead'){
        drawScene();
        drawHarvester(harvester.x,GY-harvester.h+32,false);
        requestAnimationFrame(gameLoop);return;
      }

      frame++;score+=0.1;speed=5+Math.floor(score/40)*0.4;
      harvester.vy+=0.75;harvester.y+=harvester.vy;
      if(harvester.y>=GY){harvester.y=GY;harvester.vy=0;harvester.onGround=true;}

      spawnTimer--;
      if(spawnTimer<=0){
        const type=Math.random()<.55?'bale':'chicken';
        obstacles.push({x:W+10,type,w:type==='bale'?28:18,h:type==='bale'?24:22});
        spawnTimer=55+Math.random()*55;
      }

      for(let i=obstacles.length-1;i>=0;i--){
        obstacles[i].x-=speed;
        if(obstacles[i].x<-50) obstacles.splice(i,1);
      }

      clouds.forEach(cl=>{cl.x-=cl.s;if(cl.x<-80)cl.x=W+20;});

      if(checkCollision()){
        state='dead';
        if(score>hi)hi=score;
        document.getElementById('hi-display').textContent='RÉCORD: '+Math.floor(hi);
        showDead();
        requestAnimationFrame(gameLoop);return;
      }

      drawScene();
      drawHarvester(harvester.x,GY-harvester.h+32,true);
      document.getElementById('score-display').textContent='COSECHA: '+Math.floor(score);
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();jump();}});
    canvas.addEventListener('click',jump);
    canvas.addEventListener('touchstart',e=>{e.preventDefault();jump();},{passive:false});
    document.getElementById('btn-retry').addEventListener('click',resetGame);
    document.getElementById('btn-scroll').addEventListener('click',()=>{
      document.getElementById('bottom').scrollIntoView({behavior:'smooth'});
    });

    gameLoop();
  </script>
</body>
</html>
