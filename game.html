<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{background:#EE2934;overflow:hidden}
    canvas{display:block;width:100%;height:100vh;image-rendering:pixelated}
  </style>
</head>
<body>
<canvas id="c" width="600" height="180"></canvas>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const W=600,H=180;
const LANE=[55,125];
const RED='#EE2934',WHITE='#fff',YELLOW='#FFD700';
const GROUND='#c45c1a',GROUNDTOP='#d4732a';

let state='idle',score=0,hi=0,frame=0,speed=4,spawnTimer=120;
let lane=1,targetY=LANE[1],currentY=LANE[1];
const obs=[],particles=[],clouds=[{x:80,y:10,w:55,s:.3},{x:320,y:6,w:45,s:.35},{x:510,y:12,w:40,s:.25}];

function dp(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h);}

function drawHarvester(x,y,alive){
  const g=alive?null:'#999';
  dp(x,y-16,48,20,g||YELLOW);
  dp(x+28,y-24,20,16,g||WHITE);
  dp(x+30,y-22,16,10,g||'#cce8f4');
  dp(x,y-16,4,20,g||RED);
  dp(x,y-10,8,8,g||'#7a5c10');
  dp(x+4,y+2,8,8,g||'#111');
  dp(x+6,y+3,4,6,g||'#333');
  dp(x+32,y,12,10,g||'#111');
  dp(x+34,y+1,8,8,g||'#333');
  if(alive){
    const lo=Math.floor(frame/4)%2===0?0:2;
    dp(x-6,y-8+lo,8,4,'#DAA520');
    dp(x-10,y-12,6,4,'#DAA520');
    dp(x-8,y-16+lo,6,4,'#DAA520');
  }
  dp(x+44,y-14,4,4,g||'#FF6600');
}

function drawBale(x,y){
  dp(x+2,y-20,24,20,'#d4a055');
  dp(x,y-18,4,18,GROUNDTOP);
  dp(x+24,y-18,4,18,GROUNDTOP);
  for(let i=0;i<3;i++) dp(x+4+i*8,y-20,4,20,'#b8892e');
  dp(x+8,y-22,12,4,'#e8b84b');
}

function drawWheat(x,y){
  dp(x+6,y-14,4,14,'#8B6914');
  dp(x,y-22,6,10,'#DAA520');
  dp(x+4,y-24,6,10,'#DAA520');
  dp(x+8,y-22,6,10,'#DAA520');
}

function drawSunflower(x,y){
  dp(x+6,y-14,4,14,'#4a7c30');
  ctx.fillStyle='#FF8C00';
  ctx.beginPath();ctx.arc(x+8,y-16,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#8B4513';
  ctx.beginPath();ctx.arc(x+8,y-16,3,0,Math.PI*2);ctx.fill();
}

function drawChicken(x,y,legf){
  const lo=legf?2:0;
  dp(x+4,y-22,10,10,WHITE);
  dp(x+12,y-20,4,6,WHITE);
  dp(x+14,y-20,4,4,'#FF6600');
  dp(x+2,y-20,4,4,'#FF0000');
  dp(x+2,y-14,14,10,WHITE);
  dp(x+2,y-6+lo,5,5,'#FFD700');
  dp(x+11,y-6-lo,5,5,'#FFD700');
  ctx.fillStyle='#222';ctx.fillRect(x+14,y-19,2,2);
}

function drawStone(x,y){
  dp(x+2,y-16,20,14,'#888');
  dp(x,y-12,24,8,'#999');
  dp(x+4,y-18,16,4,'#aaa');
}

function drawMole(x,y){
  const bob=Math.floor(frame/8)%2===0?0:2;
  dp(x+4,y-12+bob,16,12,'#6B4C3B');
  dp(x+6,y-16+bob,12,8,'#8B6355');
  dp(x+8,y-18+bob,8,4,'#FF9999');
  ctx.fillStyle='#111';
  ctx.fillRect(x+8,y-15+bob,3,3);
  ctx.fillRect(x+13,y-15+bob,3,3);
}

function drawCloud(x,y,w){
  ctx.fillStyle='rgba(255,255,255,0.11)';
  ctx.beginPath();
  ctx.arc(x+w*.3,y+6,w*.25,0,Math.PI*2);
  ctx.arc(x+w*.5,y+2,w*.3,0,Math.PI*2);
  ctx.arc(x+w*.7,y+6,w*.22,0,Math.PI*2);
  ctx.fill();
}

function drawLanes(){
  dp(0,70,W,8,GROUNDTOP);
  dp(0,68,W,2,'rgba(255,255,255,0.15)');
  dp(0,140,W,8,GROUNDTOP);
  dp(0,138,W,2,'rgba(255,255,255,0.15)');
}

function drawSun(){
  ctx.fillStyle='rgba(255,220,50,0.32)';
  ctx.beginPath();ctx.arc(W-35,18,14,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,220,50,0.13)';
  ctx.beginPath();ctx.arc(W-35,18,22,0,Math.PI*2);ctx.fill();
}

function spawnParticle(x,y,color){
  for(let i=0;i<5;i++) particles.push({x,y,vx:(Math.random()-0.5)*4,vy:-Math.random()*3-1,life:20,color});
}

function drawObstacle(o){
  const y=LANE[o.lane];
  if(o.type==='bale') drawBale(o.x,y);
  else if(o.type==='wheat') drawWheat(o.x,y);
  else if(o.type==='sunflower') drawSunflower(o.x,y);
  else if(o.type==='chicken') drawChicken(o.x,y,o.legf);
  else if(o.type==='stone') drawStone(o.x,y);
  else if(o.type==='mole') drawMole(o.x,y);
}

function switchLane(dir){
  if(state==='idle'){state='playing';return;}
  if(state==='dead') return;
  const newLane=lane+dir;
  if(newLane<0||newLane>1) return;
  lane=newLane;
  targetY=LANE[lane];
}

function resetGame(){
  score=0;speed=4;frame=0;spawnTimer=120;
  obs.length=0;particles.length=0;
  lane=1;targetY=LANE[1];currentY=LANE[1];
  state='playing';
}

function checkCollect(){
  for(let i=obs.length-1;i>=0;i--){
    const o=obs[i];
    if(!o.dangerous&&o.lane===lane&&o.x<80&&o.x>20){
      spawnParticle(o.x+10,LANE[o.lane]-16,'#FFD700');
      score+=o.bonus;
      obs.splice(i,1);
    }
  }
}

function checkCollision(){
  if(frame<30) return false;
  for(const o of obs){
    if(!o.dangerous) continue;
    if(o.lane===lane&&o.x<80&&o.x>20) return true;
  }
  return false;
}

canvas.addEventListener('click',function(){
  if(state==='idle'){state='playing';}
  else if(state==='dead'){resetGame();}
});

document.addEventListener('keydown',function(e){
  if(e.key==='ArrowUp'){e.preventDefault();switchLane(-1);}
  else if(e.key==='ArrowDown'){e.preventDefault();switchLane(1);}
  else if(e.code==='Space'){
    e.preventDefault();
    if(state==='idle'){state='playing';}
    else if(state==='dead'){resetGame();}
  }
});

window.addEventListener('message',function(e){
  if(e.data==='up') switchLane(-1);
  else if(e.data==='down') switchLane(1);
  else if(e.data==='start'){
    if(state==='idle'){state='playing';}
    else if(state==='dead'){resetGame();}
  }
});

function gameLoop(){
  currentY+=(targetY-currentY)*0.2;

  ctx.fillStyle=RED;ctx.fillRect(0,0,W,H);
  drawSun();
  clouds.forEach(cl=>{
    if(state==='playing') cl.x-=cl.s;
    if(cl.x<-80) cl.x=W+20;
    drawCloud(cl.x,cl.y,cl.w);
  });
  drawLanes();

  if(state==='idle'){
    drawHarvester(60,currentY,true);
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(W/2-100,H/2-18,200,36);
    ctx.fillStyle=WHITE;ctx.font='11px monospace';ctx.textAlign='center';
    ctx.fillText('TAP para empezar',W/2,H/2+4);
    requestAnimationFrame(gameLoop);return;
  }

  if(state==='playing'){
    frame++;
    score+=0.1;
    speed=4+Math.floor(score/50)*0.3;

    spawnTimer--;
    if(spawnTimer<=0){
      const r=Math.random();
      let type,dangerous,bonus;
      if(r<0.25){type='bale';dangerous=false;bonus=5;}
      else if(r<0.45){type='wheat';dangerous=false;bonus=3;}
      else if(r<0.6){type='sunflower';dangerous=false;bonus=4;}
      else if(r<0.75){type='chicken';dangerous=true;bonus=0;}
      else if(r<0.88){type='stone';dangerous=true;bonus=0;}
      else{type='mole';dangerous=true;bonus=0;}
      obs.push({x:W+10,type,lane:Math.floor(Math.random()*2),dangerous,bonus,legf:false});
      spawnTimer=55+Math.random()*55;
    }

    for(let i=obs.length-1;i>=0;i--){
      obs[i].x-=speed;
      if(obs[i].x<-60) obs.splice(i,1);
    }

    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.3;p.life--;
      if(p.life<=0) particles.splice(i,1);
    }

    checkCollect();

    if(checkCollision()){
      state='dead';
      if(score>hi) hi=score;
    }
  }

  obs.forEach(o=>{
    if(o.type==='chicken') o.legf=Math.floor(frame/6)%2===0;
    drawObstacle(o);
  });

  particles.forEach(p=>{
    ctx.globalAlpha=p.life/20;
    dp(p.x,p.y,4,4,p.color);
    ctx.globalAlpha=1;
  });

  drawHarvester(60,Math.round(currentY),state!=='dead');

  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(0,0,W,16);
  ctx.fillStyle=WHITE;ctx.font='10px monospace';ctx.textAlign='left';
  ctx.fillText('COSECHA: '+Math.floor(score),6,11);
  ctx.textAlign='right';
  ctx.fillText('RÉCORD: '+Math.floor(hi),W-6,11);

  if(state==='dead'){
    ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(W/2-130,H/2-18,260,36);
    ctx.fillStyle=WHITE;ctx.font='11px monospace';ctx.textAlign='center';
    ctx.fillText('COSECHA: '+Math.floor(score)+' · TAP para reintentar',W/2,H/2+4);
  }

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
